global:
  name: consul
  datacenter: dc1
  image: 'hashicorp/consul-enterprise:2.0.2-ent'
  enterpriseLicense:
    secretName: consul-license
    secretKey: license
  enableConsulNamespaces: true
  gossipEncryption:
    autoGenerate: true
  tls:
    enabled: true
    httpsOnly: false
    verify: false
    enableAutoEncrypt: true
    caCert:
      secretName: consul-agent-ca
      secretKey: tls.crt
    caKey:
      secretName: consul-agent-ca-key
      secretKey: tls.key    
  acls:
    manageSystemACLs: true
    createReplicationToken: true
  connectInject:
  enabled: true
server:
  replicas: 3
  exposeGossipAndRPCPorts: true
  storageClass: gp2
ui:
  enabled: true
  service:
    enabled: true
    type: LoadBalancer
syncCatalog:
  enabled: false
  toConsul: true
  toK8S: false
  addK8SNamespaceSuffix: false
  ingress:
    enabled: true
    loadBalancerIPs: true    
dns:
  enabled: true
connectInject:
  enabled: true
  default: true
  cni:
    enabled: true
  apiGateway:
    manageExternalCRDs: true
    metrics:
      enabled: true


